<div class="bookshelf">
  {{ range hugo.Data.books }}
    <a class="bookshelf__item" href="{{ .url }}" rel="noopener noreferrer" target="_blank" draggable="false">
      <span class="bookshelf__cover">
        <img src="{{ .cover }}" alt="{{ .title }}" draggable="false" />
      </span>
      <span class="bookshelf__title">{{ .title }}</span>
      <span class="bookshelf__meta">{{ .role }} · {{ .year }}</span>
    </a>
  {{ end }}
</div>
